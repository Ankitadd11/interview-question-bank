<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
<link
  href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"
  rel="stylesheet"
>
  
  <title>Interview Question Bank</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      background: #f4f6f8;
      color: #24292f;
      font-family: Arial, sans-serif;
    }

    #answerEditor {
  min-height: 220px;
  background: white;
}

.ql-toolbar {
  margin-top: 0;
  border-radius: 6px 6px 0 0;
}

.ql-container {
  min-height: 220px;
  border-radius: 0 0 6px 6px;
  font-size: 16px;
}

.ql-editor {
  min-height: 220px;
}

    .view-link {
  display: inline-block;
  margin-bottom: 18px;
  color: #0969da;
  font-weight: 600;
  text-decoration: none;
}

.view-link:hover {
  text-decoration: underline;
}
    .container {
      max-width: 720px;
      margin: auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    .description {
      margin-bottom: 24px;
      color: #57606a;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: 600;
    }

    select,
    textarea,
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    select:focus,
    textarea:focus,
    input:focus {
      border-color: #0969da;
      outline: 2px solid rgba(9, 105, 218, 0.2);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #2da44e;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #218739;
    }

    button:disabled {
      background: #94d3a2;
      cursor: wait;
    }

    #message {
      min-height: 24px;
      margin-top: 16px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Interview Question Bank</h1>

    <p class="description">
      Select a category and file, then enter the interview
      question and answer.
    </p>
    <p>
  <a href="questions.html" class="view-link">
    View Existing Interview Questions →
  </a>
</p>

    <form id="questionForm">
      <label for="category">Category</label>

  <select id="category" required>
  <option value="">Select a category</option>
  <option value="React">React</option>
  <option value="Angular">Angular</option>
  <option value="NodeJS">Node.js</option>
  <option value="TypeScript">TypeScript</option>
  <option value="JavaScript">JavaScript</option>
  <option value="Microservices">Microservices</option>
  <option value="Micro-Frontend">Micro-Frontend</option>
  <option value="AI">AI</option>
  <option value="AWS">AWS</option>
  <option value="System-Design">System Design</option>
  <option value="Behavioural">Behavioural</option>
  <option value="Project-Based">Project-Based</option>
    <option value="DevOps-Infrastructure">
  DevOps & Infrastructure
</option>
</select>

      <label for="file">File</label>

      <select id="file" required disabled>
        <option value="">
          Select a category first
        </option>
      </select>

      <label for="question">Question</label>

      <textarea
        id="question"
        placeholder="Enter the interview question"
        required
      ></textarea>

      <label for="answer">Answer</label>

   <div id="answerEditor"></div>

      <label for="appPassword">App Password</label>

      <input
        id="appPassword"
        type="password"
        placeholder="Enter the app password"
        autocomplete="current-password"
        required
      >

      <button id="submitButton" type="submit">
        Add Question
      </button>

      <p id="message" role="status"></p>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
  <script>
    const answerEditor = new Quill(
  "#answerEditor",
  {
    theme: "snow",

    placeholder: "Enter the answer",

    modules: {
      toolbar: [
        [
          {
            header: [
              1,
              2,
              3,
              false
            ]
          }
        ],

        [
          "bold",
          "italic",
          "underline",
          "strike"
        ],

        [
          {
            color: []
          },
          {
            background: []
          }
        ],

        [
          {
            list: "ordered"
          },
          {
            list: "bullet"
          }
        ],

        [
          {
            indent: "-1"
          },
          {
            indent: "+1"
          }
        ],

        [
          {
            align: []
          }
        ],

        [
          "blockquote",
          "code-block"
        ],

        [
          "link"
        ],

        [
          "clean"
        ]
      ]
    }
  }
);
    const answerEditor = new EasyMDE({
  element: document.getElementById("answer"),

  placeholder: "Enter the answer",

  spellChecker: false,

  status: false,

  minHeight: "180px",

  toolbar: [
    "bold",
    "italic",
    "heading",
    "|",
    "unordered-list",
    "ordered-list",
    "|",
    "link",
    "code",
    "|",
    "preview",
    "side-by-side",
    "fullscreen"
  ]
});
    const githubOwner = "Ankitadd11";
    const githubRepository = "interview-question-bank";

    const categoryElement =
      document.getElementById("category");

    const fileElement =
      document.getElementById("file");

    const formElement =
      document.getElementById("questionForm");

    const messageElement =
      document.getElementById("message");

    const submitButton =
      document.getElementById("submitButton");

    categoryElement.addEventListener(
      "change",
      loadFiles
    );

    async function loadFiles() {
      const category = categoryElement.value;

      fileElement.disabled = true;

      messageElement.textContent = "";

      if (!category) {
        fileElement.innerHTML =
          '<option value="">' +
          "Select a category first" +
          "</option>";

        return;
      }

      fileElement.innerHTML =
        '<option value="">' +
        "Loading files..." +
        "</option>";

      const apiUrl =
        `https://api.github.com/repos/` +
        `${githubOwner}/${githubRepository}` +
        `/contents/questions/` +
        encodeURIComponent(category);

      try {
        const response = await fetch(apiUrl, {
          headers: {
            Accept: "application/vnd.github+json"
          }
        });

        if (!response.ok) {
          throw new Error(
            "Could not load files from this category."
          );
        }

        const items = await response.json();

        const markdownFiles = items.filter(
          item =>
            item.type === "file" &&
            item.name.toLowerCase().endsWith(".md")
        );

        fileElement.innerHTML =
          '<option value="">' +
          "Select a file" +
          "</option>";

        markdownFiles.forEach(file => {
          const option =
            document.createElement("option");

          option.value = file.name;
          option.textContent = file.name;

          fileElement.appendChild(option);
        });

        if (markdownFiles.length === 0) {
          fileElement.innerHTML =
            '<option value="">' +
            "No Markdown files found" +
            "</option>";

          messageElement.style.color = "#cf222e";

          messageElement.textContent =
            "No Markdown files were found in this category.";

          return;
        }

        fileElement.disabled = false;
      } catch (error) {
        fileElement.innerHTML =
          '<option value="">' +
          "Unable to load files" +
          "</option>";

        messageElement.style.color = "#cf222e";
        messageElement.textContent = error.message;
      }
    }

    formElement.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        const category = categoryElement.value;
        const file = fileElement.value;

        const question = document
          .getElementById("question")
          .value
          .trim();

       const answer = answerEditor
  .getSemanticHTML()
  .trim();

        const appPassword = document
          .getElementById("appPassword")
          .value;

        if (
          !category ||
          !file ||
          !question ||
          !answerText ||
          !appPassword
        ) {
          messageElement.style.color = "#cf222e";

          messageElement.textContent =
            "Please complete every field.";

          return;
        }

        submitButton.disabled = true;

        submitButton.textContent =
          "Adding question...";

        messageElement.textContent = "";

        try {
          const response = await fetch(
            "/api/questions",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
                "X-App-Password": appPassword
              },

              body: JSON.stringify({
                category,
                file,
                question,
                answer
              })
            }
          );

          const result = await response.json();

          if (!response.ok) {
            throw new Error(
              result.error ||
              "Unable to add the question."
            );
          }

          messageElement.style.color = "#1a7f37";

          messageElement.textContent =
            `${result.questionNumber} added ` +
            `successfully to ${result.path}.`;

          document
            .getElementById("question")
            .value = "";

        
          answerEditor.setText("");
          
          document
            .getElementById("question")
            .focus();
        } catch (error) {
          messageElement.style.color = "#cf222e";
          messageElement.textContent = error.message;
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Add Question";
        }
      }
    );
  </script>
</body>
</html>
