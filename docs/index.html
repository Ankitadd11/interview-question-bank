<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Interview Question Bank</title>

  <!-- Quill Rich Text Editor -->
  <link
    href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      background: #f4f6f8;
      color: #24292f;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    .description {
      margin-bottom: 10px;
      color: #57606a;
    }

    .view-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #0969da;
      font-weight: 600;
      text-decoration: none;
    }

    .view-link:hover {
      text-decoration: underline;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: 600;
    }

    select,
    textarea,
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    select:focus,
    textarea:focus,
    input:focus {
      border-color: #0969da;
      outline: 2px solid rgba(9, 105, 218, 0.2);
    }

    /* Quill Editor */

    #answerEditor {
      min-height: 220px;
      background: white;
    }

    .ql-toolbar {
      border-radius: 6px 6px 0 0;
      background: #f6f8fa;
    }

    .ql-container {
      min-height: 220px;
      border-radius: 0 0 6px 6px;
      font-size: 16px;
    }

    .ql-editor {
      min-height: 220px;
      line-height: 1.6;
    }

    .ql-editor a {
      color: #0969da;
    }

    /* Submit button */

    #submitButton {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #2da44e;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    #submitButton:hover {
      background: #218739;
    }

    #submitButton:disabled {
      background: #94d3a2;
      cursor: wait;
    }

    #message {
      min-height: 24px;
      margin-top: 16px;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px 10px;
      }

      .container {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Interview Question Bank</h1>

    <p class="description">
      Select a category and file, then enter the interview
      question and answer.
    </p>

    <a
      href="questions.html"
      class="view-link"
    >
      View Existing Interview Questions →
    </a>

    <form id="questionForm">

      <!-- Category -->

      <label for="category">
        Category
      </label>

      <select id="category" required>

        <option value="">
          Select a category
        </option>

        <option value="React">
          React
        </option>

        <option value="Angular">
          Angular
        </option>

        <option value="NodeJS">
          Node.js
        </option>

        <option value="TypeScript">
          TypeScript
        </option>

        <option value="JavaScript">
          JavaScript
        </option>

        <option value="Microservices">
          Microservices
        </option>

        <option value="Micro-Frontend">
          Micro-Frontend
        </option>

        <option value="AI">
          AI
        </option>

        <option value="AWS">
          AWS
        </option>

        <option value="DevOps-Infrastructure">
          DevOps & Infrastructure
        </option>

        <option value="System-Design">
          System Design
        </option>

        <option value="Behavioural">
          Behavioural
        </option>

        <option value="Project-Based">
          Project-Based
        </option>

      </select>

      <!-- File -->

      <label for="file">
        File
      </label>

      <select
        id="file"
        required
        disabled
      >
        <option value="">
          Select a category first
        </option>
      </select>

      <!-- Question -->

      <label for="question">
        Question
      </label>

      <textarea
        id="question"
        placeholder="Enter the interview question"
        required
      ></textarea>

      <!-- Answer -->

      <label id="answerLabel">
        Answer
      </label>

      <div
        id="answerEditor"
        aria-labelledby="answerLabel"
      ></div>

      <!-- Password -->

      <label for="appPassword">
        App Password
      </label>

      <input
        id="appPassword"
        type="password"
        placeholder="Enter the app password"
        autocomplete="current-password"
        required
      >

      <!-- Submit -->

      <button
        id="submitButton"
        type="submit"
      >
        Add Question
      </button>

      <p
        id="message"
        role="status"
      ></p>

    </form>

  </main>

  <!-- Quill Library -->

  <script
    src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"
  ></script>

  <script>

    /*
     * GitHub configuration
     */

    const githubOwner =
      "Ankitadd11";

    const githubRepository =
      "interview-question-bank";


    /*
     * Page elements
     */

    const categoryElement =
      document.getElementById("category");

    const fileElement =
      document.getElementById("file");

    const formElement =
      document.getElementById("questionForm");

    const messageElement =
      document.getElementById("message");

    const submitButton =
      document.getElementById("submitButton");


    /*
     * Quill editor
     */

    const answerEditor = new Quill(
      "#answerEditor",
      {
        theme: "snow",

        placeholder:
          "Enter the answer",

        modules: {
          toolbar: [

            [
              {
                header: [
                  1,
                  2,
                  3,
                  false
                ]
              }
            ],

            [
              "bold",
              "italic",
              "underline",
              "strike"
            ],

            [
              {
                color: []
              },
              {
                background: []
              }
            ],

            [
              {
                list: "ordered"
              },
              {
                list: "bullet"
              }
            ],

            [
              {
                indent: "-1"
              },
              {
                indent: "+1"
              }
            ],

            [
              {
                align: []
              }
            ],

            [
              "blockquote",
              "code-block"
            ],

            [
              "link"
            ],

            [
              "clean"
            ]

          ]
        }
      }
    );


    /*
     * Load files when category changes
     */

    categoryElement.addEventListener(
      "change",
      loadFiles
    );


    async function loadFiles() {

      const category =
        categoryElement.value;

      fileElement.disabled = true;

      messageElement.textContent = "";

      if (!category) {

        fileElement.innerHTML =
          '<option value="">' +
          'Select a category first' +
          '</option>';

        return;
      }

      fileElement.innerHTML =
        '<option value="">' +
        'Loading files...' +
        '</option>';


      const apiUrl =
        `https://api.github.com/repos/` +
        `${githubOwner}/${githubRepository}` +
        `/contents/questions/` +
        encodeURIComponent(category);


      try {

        const response =
          await fetch(
            apiUrl,
            {
              headers: {
                Accept:
                  "application/vnd.github+json"
              }
            }
          );


        if (!response.ok) {

          throw new Error(
            "Could not load files from this category."
          );

        }


        const items =
          await response.json();


        const markdownFiles =
          items.filter(
            item =>
              item.type === "file" &&
              item.name
                .toLowerCase()
                .endsWith(".md")
          );


        fileElement.innerHTML =
          '<option value="">' +
          'Select a file' +
          '</option>';


        markdownFiles.forEach(
          file => {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              file.name;

            option.textContent =
              file.name;

            fileElement.appendChild(
              option
            );

          }
        );


        if (
          markdownFiles.length === 0
        ) {

          fileElement.innerHTML =
            '<option value="">' +
            'No Markdown files found' +
            '</option>';

          messageElement.style.color =
            "#cf222e";

          messageElement.textContent =
            "No Markdown files were found " +
            "in this category.";

          return;
        }


        fileElement.disabled =
          false;

      } catch (error) {

        fileElement.innerHTML =
          '<option value="">' +
          'Unable to load files' +
          '</option>';

        messageElement.style.color =
          "#cf222e";

        messageElement.textContent =
          error.message;

      }

    }


    /*
     * Submit question
     */

    formElement.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const category =
          categoryElement.value;

        const file =
          fileElement.value;


        const question =
          document
            .getElementById(
              "question"
            )
            .value
            .trim();


        /*
         * Plain text is used only
         * for empty-answer validation.
         */

        const answerText =
          answerEditor
            .getText()
            .trim();


        /*
         * Formatted HTML is saved.
         */

       const answer = answerEditor
  .getSemanticHTML()
  .replace(/&nbsp;/gi, " ")
  .replace(/\u00A0/g, " ")
  .trim();


        const appPassword =
          document
            .getElementById(
              "appPassword"
            )
            .value;


        /*
         * Validation
         */

        if (
          !category ||
          !file ||
          !question ||
          !answerText ||
          !appPassword
        ) {

          messageElement.style.color =
            "#cf222e";

          messageElement.textContent =
            "Please complete every field.";

          return;

        }


        /*
         * Disable button while saving
         */

        submitButton.disabled =
          true;

        submitButton.textContent =
          "Adding question...";

        messageElement.textContent =
          "";


        try {

          /*
           * This calls the Vercel API
           * when this page is running
           * from Vercel.
           */

          const response =
            await fetch(
              "/api/questions",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "X-App-Password":
                    appPassword
                },

                body: JSON.stringify({
                  category,
                  file,
                  question,
                  answer
                })
              }
            );


          const result =
            await response.json();


          if (!response.ok) {

            throw new Error(
              result.error ||
              "Unable to add the question."
            );

          }


          /*
           * Success
           */

          messageElement.style.color =
            "#1a7f37";

          messageElement.textContent =
            `${result.questionNumber} ` +
            `added successfully to ` +
            `${result.path}.`;


          /*
           * Clear question
           */

          document
            .getElementById(
              "question"
            )
            .value = "";


          /*
           * Clear Quill editor
           */

          answerEditor.setText("");


          /*
           * Put cursor back
           * into question field
           */

          document
            .getElementById(
              "question"
            )
            .focus();


        } catch (error) {

          messageElement.style.color =
            "#cf222e";

          messageElement.textContent =
            error.message;

        } finally {

          submitButton.disabled =
            false;

          submitButton.textContent =
            "Add Question";

        }

      }
    );

  </script>

</body>
</html>
